<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DALOZI STORE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --black:#0B0B0D; --black2:#151518; --cream:#FAF8F5; --ivory:#FFFDF8;
  --gold:#D4AF37; --gold-dark:#A9822A; --rose:#E0A96D;
  --gold-grad:linear-gradient(120deg,#B8912E,#EAC96A,#B8912E);
  --ink:#1A1A1D; --muted:#6B665C; --line:#E7DFCE;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  box-sizing:border-box;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{font-family:'Tajawal',sans-serif;background:var(--cream);color:var(--ink);overflow-x:hidden;-webkit-font-smoothing:antialiased;}
h1,h2,.brand{font-family:'Playfair Display',serif;}
img{max-width:100%;}
button{font-family:inherit;cursor:pointer;border:none;}

/* Announcement bar */
.announce{background:var(--black);color:var(--gold);overflow:hidden;white-space:nowrap;padding:9px 0;font-size:.82rem;font-weight:500;border-bottom:1px solid #2a2a1f;}
.announce span{display:inline-block;padding-inline-end:60px;animation:scroll 24s linear infinite;}
@keyframes scroll{from{transform:translateX(100%)}to{transform:translateX(-100%)}}

/* Header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--black);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 4px 20px rgba(0,0,0,.35);flex-wrap:wrap;gap:12px;border-bottom:1px solid var(--gold-dark);}
.logo-wrap{display:flex;align-items:center;gap:12px;}
.logo-wrap img{height:50px;width:auto;border-radius:8px;}
.logo-wrap .brand{color:var(--gold);font-size:1.4rem;letter-spacing:1.5px;font-weight:700;}
nav.cats{display:flex;gap:22px;flex-wrap:wrap;position:relative;}
.cat{position:relative;}
.cat>span{color:#E8E4D8;font-size:.88rem;cursor:pointer;padding:8px 2px;font-weight:500;border-bottom:1.5px solid transparent;transition:.2s;}
.cat:hover>span, .cat>span:focus{color:var(--gold);border-color:var(--gold);}
.cat .drop{display:none;position:absolute;top:100%;right:0;background:var(--black2);min-width:210px;border:1px solid var(--gold-dark);border-radius:10px;overflow:hidden;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.4);}
.cat:hover .drop{display:block;}
.cat .drop a{display:block;padding:11px 16px;color:#EDE9DD;text-decoration:none;font-size:.85rem;border-bottom:1px solid #26262b;}
.cat .drop a:last-child{border-bottom:none;}
.cat .drop a:hover{background:var(--gold);color:var(--black);}
.icons{display:flex;gap:18px;align-items:center;}
.icons button{background:none;color:var(--gold);font-size:1.25rem;position:relative;}
.badge-count{position:absolute;top:-8px;left:-10px;background:var(--gold);color:var(--black);font-size:.65rem;border-radius:50%;width:18px;height:18px;display:flex;align-items:center;justify-content:center;font-weight:700;}

/* Hero */
.hero{background:radial-gradient(circle at 30% 20%,#1c1c22,var(--black) 75%);color:var(--cream);text-align:center;padding:70px 20px;position:relative;border-bottom:1px solid var(--gold-dark);}
.hero::before,.hero::after{content:"";position:absolute;top:22px;bottom:22px;width:1px;background:linear-gradient(var(--gold-dark),transparent);opacity:.5;}
.hero::before{right:8%;} .hero::after{left:8%;}
.hero h1{font-size:clamp(2rem,5vw,3.2rem);background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:14px;font-weight:700;letter-spacing:1px;}
.hero p{color:#C9C6BC;margin-bottom:28px;font-size:1.05rem;}
.cta-row{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;}
.btn-gold{background:var(--gold-grad);color:#1a1400;padding:13px 30px;border-radius:6px;font-weight:700;font-size:.95rem;box-shadow:0 6px 16px rgba(212,175,55,.25);}
.btn-outline{border:1.5px solid var(--gold);color:var(--gold);background:transparent;padding:13px 30px;border-radius:6px;font-weight:700;font-size:.95rem;}

/* Section title */
.section{padding:50px 20px;max-width:1200px;margin:0 auto;}
.section h2{text-align:center;color:var(--ink);font-size:1.7rem;margin-bottom:8px;font-weight:700;}
.section h2 span{color:var(--gold-dark);}
.section .subline{text-align:center;color:var(--muted);font-size:.85rem;margin-bottom:30px;}

/* Product grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:24px;}
.card{background:var(--ivory);border-radius:12px;overflow:hidden;box-shadow:0 3px 14px rgba(20,15,5,.07);border:1px solid var(--line);position:relative;transition:transform .2s,box-shadow .2s;}
.card:hover{transform:translateY(-5px);box-shadow:0 12px 28px rgba(20,15,5,.14);}
.thumb{height:170px;display:flex;align-items:center;justify-content:center;font-size:2.8rem;position:relative;background:linear-gradient(135deg,#F3ECDD,#E8D9B0);}
.badge{position:absolute;top:12px;right:12px;background:var(--gold-grad);color:#1a1400;font-size:.68rem;font-weight:700;padding:5px 11px;border-radius:20px;letter-spacing:.3px;}
.card-body{padding:16px;}
.card-body h3{font-size:1.02rem;margin-bottom:7px;color:var(--ink);font-weight:700;}
.stars{color:var(--gold-dark);font-size:.85rem;margin-bottom:4px;}
.review{font-size:.72rem;color:var(--muted);margin-bottom:10px;}
.price{color:var(--gold-dark);font-weight:700;font-size:1.1rem;margin-bottom:10px;}
.swatches{display:flex;gap:6px;margin-bottom:10px;}
.sw{width:16px;height:16px;border-radius:50%;border:1px solid #bbb;}
.qty-note{font-size:.72rem;color:var(--muted);margin-bottom:10px;}
.card-actions{display:flex;flex-direction:column;gap:7px;}
.card-actions button{padding:10px;border-radius:7px;font-size:.8rem;font-weight:700;}
.add-cart{background:var(--black);color:var(--gold);}
.whatsapp{background:#1FA855;color:#fff;}
.edit-btn{background:#F0E9D6;color:var(--ink);border:1px solid var(--line);}

/* Cart drawer */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:90;}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(360px,88vw);background:var(--ivory);z-index:95;transform:translateX(-100%);transition:transform .3s;display:flex;flex-direction:column;padding:20px;padding-top:calc(20px + env(safe-area-inset-top,0px));box-shadow:6px 0 26px rgba(0,0,0,.25);}
.drawer.open{transform:translateX(0);}
.overlay.show{display:block;}
.drawer h2{font-size:1.15rem;margin-bottom:16px;display:flex;justify-content:space-between;color:var(--ink);}
.drawer h2 button{background:none;font-size:1.3rem;color:var(--muted);}
.cart-item{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);font-size:.85rem;color:var(--ink);}
.cart-item button{background:#EEE6D0;color:var(--ink);border-radius:6px;padding:3px 9px;font-weight:700;}
.cart-total{margin-top:auto;padding-top:16px;border-top:2px solid var(--gold);font-weight:700;display:flex;justify-content:space-between;color:var(--ink);}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:99;padding:16px;}
.modal-overlay.show{display:flex;}
.modal{background:var(--ivory);border-radius:14px;padding:26px;max-width:430px;width:100%;max-height:85vh;overflow-y:auto;border:1px solid var(--gold-dark);}
.modal h2{font-size:1.25rem;margin-bottom:18px;color:var(--ink);font-weight:700;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:.82rem;margin-bottom:6px;color:var(--muted);font-weight:500;}
.field input,.field select{width:100%;padding:11px;border:1.5px solid #DDD3B8;border-radius:8px;font-family:inherit;font-size:.9rem;background:#fff;color:#111;}
.field input::placeholder{color:#9a9a9a;}
.field select{color:#111;background:#fff;}
.field input:focus,.field select:focus{outline:none;border-color:var(--gold);}
.modal .btn-gold{width:100%;margin-top:10px;}
.close-x{position:absolute;top:14px;left:14px;background:none;font-size:1.3rem;color:var(--muted);}
.summary-row{display:flex;justify-content:space-between;font-size:.85rem;padding:4px 0;color:var(--ink);}

footer{background:var(--black);color:#9a9689;text-align:center;padding:28px;font-size:.8rem;border-top:1px solid var(--gold-dark);}
footer .brand{color:var(--gold);display:block;margin-bottom:4px;font-size:1.1rem;}

/* Lang selector + account button */
.lang-wrap{position:relative;}
.lang-wrap>button{background:none;color:var(--gold);font-size:.85rem;font-weight:700;border:1px solid var(--gold-dark);border-radius:20px;padding:6px 12px;}
.lang-drop{display:none;position:absolute;top:115%;left:0;background:var(--black2);border:1px solid var(--gold-dark);border-radius:10px;overflow:hidden;min-width:140px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.4);}
.lang-drop.show{display:block;}
.lang-drop a{display:block;padding:10px 16px;color:#EDE9DD;font-size:.85rem;cursor:pointer;}
.lang-drop a:hover{background:var(--gold);color:var(--black);}
.acc-btn{background:var(--gold-grad);color:#1a1400;font-weight:700;font-size:.82rem;padding:9px 18px;border-radius:20px;}

.acc-types{display:flex;gap:12px;margin-bottom:16px;}
.acc-type{flex:1;border:1.5px solid var(--line);border-radius:10px;padding:16px 10px;text-align:center;cursor:pointer;font-size:.85rem;font-weight:700;color:var(--ink);}
.acc-type.selected{border-color:var(--gold);background:#FBF3DB;}
.acc-type .ico{font-size:1.6rem;display:block;margin-bottom:6px;}
.seller-box{display:none;background:#F7F1E2;border:1px dashed var(--gold-dark);border-radius:10px;padding:14px;margin-top:6px;}
.seller-box.show{display:block;}
.seller-box h3{font-size:.95rem;margin-bottom:10px;color:var(--gold-dark);}

/* Language + welcome splash */
.lang-splash{position:fixed;inset:0;z-index:200;background:radial-gradient(circle at 50% 20%,#232228,var(--black) 75%);display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;}
.splash-inner{max-width:480px;}
.splash-brand{font-size:clamp(2.2rem,7vw,3.4rem);background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:24px;letter-spacing:1px;font-weight:700;}
.splash-tri{color:var(--cream);font-size:1.05rem;margin-bottom:6px;}
.splash-tri-sub{color:#B9B4A6;font-size:.85rem;margin-bottom:30px;}
.lang-big-row{display:flex;flex-direction:column;gap:14px;}
.lang-big-btn{background:transparent;border:1.5px solid var(--gold);color:var(--gold);padding:15px 20px;border-radius:10px;font-size:1rem;font-weight:700;transition:.2s;}
.lang-big-btn:hover{background:var(--gold-grad);color:#1a1400;}
.welcome-title{color:var(--gold);font-size:1.8rem;margin-bottom:16px;font-family:'Playfair Display',serif;}
.welcome-msg{color:#D8D4C8;font-size:.95rem;line-height:1.9;margin-bottom:28px;}

/* Category menu button + search */
.cat-menu-wrap{display:flex;align-items:center;gap:10px;position:relative;flex:1;justify-content:center;flex-wrap:wrap;min-width:200px;}
.menu-btn{background:none;color:var(--gold);font-size:1.2rem;border:1px solid var(--gold-dark);border-radius:8px;padding:7px 14px;}
.cat-search-wrap{position:relative;flex:1;max-width:320px;min-width:160px;}
.cat-search{width:100%;padding:9px 14px;border-radius:20px;border:1px solid var(--gold-dark);background:#1a1a1e;color:#EDE9DD;font-size:.85rem;font-family:inherit;}
.cat-search::placeholder{color:#8a8578;}
.cat-search:focus{outline:none;border-color:var(--gold);}
.search-suggest{display:none;position:absolute;top:110%;right:0;left:0;background:var(--black2);border:1px solid var(--gold-dark);border-radius:10px;overflow:hidden;z-index:70;max-height:260px;overflow-y:auto;box-shadow:0 8px 24px rgba(0,0,0,.4);}
.search-suggest.show{display:block;}
.search-suggest div{padding:10px 14px;color:#EDE9DD;font-size:.85rem;cursor:pointer;border-bottom:1px solid #26262b;}
.search-suggest div:last-child{border-bottom:none;}
.search-suggest div:hover{background:var(--gold);color:var(--black);}
.cat-panel{display:none;position:absolute;top:120%;right:0;left:0;background:var(--black2);border:1px solid var(--gold-dark);border-radius:12px;z-index:65;padding:16px;box-shadow:0 10px 30px rgba(0,0,0,.4);}
.cat-panel.show{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;}
.cat-block{background:#1d1d21;border:1px solid #2c2c31;border-radius:10px;padding:12px;cursor:pointer;transition:.2s;}
.cat-block:hover{border-color:var(--gold);}
.cat-block h4{color:var(--gold);font-size:.88rem;margin-bottom:8px;}
.cat-tags{display:flex;flex-wrap:wrap;gap:6px;}
.cat-tags span{background:#2a2a2f;color:#cfc9ba;font-size:.72rem;padding:4px 8px;border-radius:12px;}
.card.highlight{outline:3px solid var(--gold);outline-offset:2px;}

/* ===== Bottom navigation bar ===== */
#mainApp{padding-bottom:calc(68px + env(safe-area-inset-bottom,0px));}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:80;background:var(--black);border-top:1px solid var(--gold-dark);display:flex;justify-content:space-around;align-items:stretch;padding:6px 2px calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 20px rgba(0,0,0,.35);}
.bn-item{background:none;border:none;color:#B9B4A6;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.64rem;font-weight:600;flex:1;position:relative;padding:5px 2px;border-radius:8px;transition:.2s;}
.bn-item:active{background:rgba(212,175,55,.12);}
.bn-item .bn-ico{font-size:1.28rem;color:var(--gold);line-height:1;}
.bn-badge{position:absolute;top:0px;left:calc(50% + 8px);background:var(--gold-grad);color:#1a1400;font-size:.6rem;border-radius:50%;min-width:16px;height:16px;display:flex;align-items:center;justify-content:center;font-weight:700;padding:0 3px;}

/* ===== Side menu (drawer) ===== */
.side-menu-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:150;}
.side-menu-overlay.show{display:block;}
.side-menu{position:fixed;top:0;bottom:0;right:0;width:min(320px,86vw);background:var(--black2);z-index:155;transform:translateX(100%);transition:transform .3s;overflow-y:auto;padding:20px;padding-top:calc(20px + env(safe-area-inset-top,0px));padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));box-shadow:-6px 0 26px rgba(0,0,0,.35);}
.side-menu.open{transform:translateX(0);}
.sm-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;padding-bottom:14px;border-bottom:1px solid var(--gold-dark);}
.sm-head .brand{color:var(--gold);font-size:1.15rem;}
.sm-head button{background:none;color:#B9B4A6;font-size:1.3rem;}
.sm-section-title{color:#8a8578;font-size:.7rem;letter-spacing:1.2px;margin:18px 0 6px;text-transform:uppercase;font-weight:700;}
.sm-link{display:flex;align-items:center;gap:10px;padding:12px 2px;color:#EDE9DD;font-size:.92rem;border-bottom:1px solid #26262b;cursor:pointer;}
.sm-link:hover{color:var(--gold);}
.sm-link .sm-ico{font-size:1.1rem;width:22px;text-align:center;}
.sm-cat{border-bottom:1px solid #26262b;}
.sm-cat-head{display:flex;justify-content:space-between;align-items:center;padding:12px 2px;color:#EDE9DD;font-size:.9rem;cursor:pointer;gap:10px;}
.sm-cat-head:hover{color:var(--gold);}
.sm-cat-head .chev{transition:.2s;color:#8a8578;font-size:.8rem;}
.sm-cat-head.open .chev{transform:rotate(180deg);}
.sm-cat-subs{display:none;padding:0 2px 12px 4px;}
.sm-cat-subs.show{display:block;}
.sm-cat-subs span{display:block;color:#B9B4A6;font-size:.8rem;padding:6px 0 6px 18px;cursor:pointer;}
.sm-cat-subs span:hover{color:var(--gold);}
</style>
</head>
<body>

<div id="langSplash" class="lang-splash">
  <div class="splash-inner">
    <h1 class="splash-brand">DALOZI STORE</h1>
    <div id="splashStepA">
      <p class="splash-tri">مرحباً بك · Bienvenue · Welcome</p>
      <p class="splash-tri-sub">يرجى اختيار اللغة · Choisissez votre langue · Please choose your language</p>
      <div class="lang-big-row">
        <button class="lang-big-btn" onclick="selectLangSplash('ar')">🇩🇿 العربية</button>
        <button class="lang-big-btn" onclick="selectLangSplash('fr')">🇫🇷 Français</button>
        <button class="lang-big-btn" onclick="selectLangSplash('en')">🇬🇧 English</button>
      </div>
    </div>
    <div id="splashStepB" style="display:none;">
      <h2 id="welcomeTitle" class="welcome-title"></h2>
      <p id="welcomeMsg" class="welcome-msg"></p>
      <button class="btn-gold" id="welcomeContinue" onclick="continueToAccount()"></button>
    </div>
  </div>
</div>

<div id="mainApp" style="display:none;">
<div class="announce"><span id="announceTxt"></span></div>

<header>

const catSubs=[["Aura Collection","Huda Hijab"],["تشكيلة رجالية","ألوان متعددة"],["كيك المناسبات","بقلاوة و تارتلات"],["بوفيه مالح","تنظيم المناسبات"],["HM Dalozi Skincare","أدوات تجميل"]];
function toggleCatMenu(){
  document.getElementById('catPanel').classList.toggle('show');

}
function renderCatPanel(){
  const T = I18N[lang];
  document.getElementById('catPanel').innerHTML = T.cats.map((c,i)=>`
    <div class="cat-block" onclick="scrollToProducts()">
      <h4>${c}</h4>
      <div class="cat-tags"><span>${catSubs[i][0]}</span><span>${catSubs[i][1]}</span></div>
    </div>`).join('');
}
function scrollToProducts(){
  document.getElementById('catPanel').classList.remove('show');
  document.getElementById('products').scrollIntoView({behavior:'smooth'});
}
function onCatSearch(q){
  const box = document.getElementById('searchSuggest');
  q = q.trim().toLowerCase();
  if(!q){ box.classList.remove('show'); box.innerHTML=''; return; }
  const T = I18N[lang];
  let results = [];
  T.cats.forEach((c,i)=>{
    if(c.toLowerCase().includes(q)) results.push({label:c, action:'scrollToProducts()'});
    catSubs[i].forEach(s=>{ if(s.toLowerCase().includes(q)) results.push({label:s, action:'scrollToProducts()'}); });
  });
  products.forEach(p=>{
    if(p.name.toLowerCase().includes(q)) results.push({label:p.name+' — '+p.price.toLocaleString()+' د.ج', action:'goToProduct('+p.id+')'});
  });
  results = results.slice(0,8);
  box.innerHTML = results.length===0
    ? `<div style="cursor:default;color:#999;">${T.noResults}</div>`
    : results.map(r=>`<div onclick="${r.action}">${r.label}</div>`).join('');
  box.classList.add('show');
}
function goToProduct(id){

  setTimeout(()=>{
    const el = document.getElementById('prod-'+id);
    if(el){ el.scrollIntoView({behavior:'smooth', block:'center'}); el.classList.add('highlight'); setTimeout(()=>el.classList.remove('highlight'), 2000); }
  }, 400);
}

/* ---------- Splash: language + welcome + onboarding flow ---------- */
function selectLangSplash(l){
  lang = l; try{ localStorage.setItem('dalozi_lang', l); }catch(e){}
  applyI18n();
  const T = I18N[l];
  document.getElementById('welcomeTitle').textContent = T.welcomeTitle;
  document.getElementById('welcomeMsg').textContent = T.welcomeMsg;
  document.getElementById('welcomeContinue').textContent = T.continueBtn;
  document.getElementById('splashStepA').style.display = 'none';
  document.getElementById('splashStepB').style.display = 'block';
}
function continueToAccount(){
  document.getElementById('langSplash').style.display = 'none';
  openAccountModal();
}
function showMainApp(){
  document.getElementById('mainApp').style.display = 'block';
}
function closeAccount(){
  closeModal('accountModal');
  showMainApp();
}

/* ---------- Account modal (buyer/seller) ---------- */
let accType = 'buyer';
function openAccountModal(){
  document.getElementById('accountModal').classList.add('show');
  selectAccType('buyer');
}
function selectAccType(type){
  accType = type;
  document.getElementById('typeBuyer').classList.toggle('selected', type==='buyer');
  document.getElementById('typeSeller').classList.toggle('selected', type==='seller');
  document.getElementById('sellerBox').classList.toggle('show', type==='seller');
}
function submitAccount(){
  const name = document.getElementById('accName').value;
  const phone = document.getElementById('accPhone').value;
  if(!name||!phone){ alert(t('needNamePhone')); return; }
  alert(accType==='seller' ? t('accSellerOk') : t('accBuyerOk'));
  closeAccount();
}

function renderGrid(){
  const T = I18N[lang];
  const grid = document.getElementById('grid');
  grid.innerHTML = products.map(p=>`
    <div class="card" id="prod-${p.id}">
      ${p.badge? `<span class="badge">${p.badge}</span>`:''}
      <div class="thumb" style="background:linear-gradient(135deg,#f3ede1,#e5d7b8);">${p.emoji}</div>
      <div class="card-body">
        <h3>${p.name}</h3>
        <div class="stars">${'★'.repeat(p.rating)}${'☆'.repeat(5-p.rating)}</div>
        <div class="review">${T.review}</div>
        <div class="price">${p.price.toLocaleString()} د.ج</div>
        <div class="swatches">
          <span class="sw" style="background:#D4AF37"></span>
          <span class="sw" style="background:#0F0F12"></span>
          <span class="sw" style="background:#E0A96D"></span>
        </div>
        <div style="font-size:.72rem;color:#888;margin-bottom:8px;">${T.qtyLbl}: ${p.qty}</div>
        <div class="card-actions">
          <button class="add-cart" onclick="addToCart(${p.id})">${T.addCart}</button>
          <button class="whatsapp" onclick="orderWhatsapp(${p.id})">${T.waOrder}</button>
          <button class="edit-btn" onclick="openEdit(${p.id})">${T.editBtn}</button>
        </div>
      </div>
    </div>`).join('');
}

function addToCart(id){
  const item = cart.find(c=>c.id===id);
  if(item) item.qty++; else cart.push({id,qty:1});
  updateCartUI();
}
function changeQty(id,delta){
  const item = cart.find(c=>c.id===id);
  if(!item) return;
  item.qty += delta;
  if(item.qty<=0) cart = cart.filter(c=>c.id!==id);
  updateCartUI();
}
function updateCartUI(){
  document.getElementById('cartCount').textContent = cart.reduce((s,c)=>s+c.qty,0);
  document.getElementById('bnCartCount').textContent = cart.reduce((s,c)=>s+c.qty,0);
  const box = document.getElementById('cartItems');
  if(cart.length===0){ box.innerHTML = `<p style="text-align:center;color:#999;padding:30px 0;">${t('cartEmpty')}</p>`; }
  else{
    box.innerHTML = cart.map(c=>{
      const p = products.find(x=>x.id===c.id);
      return `<div class="cart-item"><span>${p.name} × ${c.qty}</span>
        <span>
          <button onclick="changeQty(${p.id},-1)">−</button>
          <button onclick="changeQty(${p.id},1)">+</button>
        </span></div>`;
    }).join('');
  }
  const total = cart.reduce((s,c)=>{const p=products.find(x=>x.id===c.id); return s + p.price*c.qty;},0);
  document.getElementById('cartTotal').textContent = total.toLocaleString()+' د.ج';
}

function toggleCart(){
  document.getElementById('drawer').classList.add('open');
  document.getElementById('overlay').classList.add('show');
}

/* ---------- Side menu (drawer) ---------- */
function openSideMenu(){
  renderSideMenuCats();
  document.getElementById('sideMenu').classList.add('open');
  document.getElementById('sideMenuOverlay').classList.add('show');
}
function closeSideMenu(){
  document.getElementById('sideMenu').classList.remove('open');
  document.getElementById('sideMenuOverlay').classList.remove('show');
  document.getElementById('langDrop').classList.remove('show');
}
function renderSideMenuCats(){
  const T = I18N[lang];
  document.getElementById('smCatList').innerHTML = T.cats.map((c,i)=>`
    <div class="sm-cat">
      <div class="sm-cat-head" onclick="toggleSmCat(${i})" id="smCatHead${i}">
        <span>${c}</span><span class="chev">▾</span>
      </div>
      <div class="sm-cat-subs" id="smCatSubs${i}">
        <span onclick="scrollToProducts()">${catSubs[i][0]}</span>
        <span onclick="scrollToProducts()">${catSubs[i][1]}</span>
      </div>
    </div>`).join('');
}
function toggleSmCat(i){
  document.getElementById('smCatSubs'+i).classList.toggle('show');
  document.getElementById('smCatHead'+i).classList.toggle('open');
}

/* ---------- Bottom nav actions ---------- */
function bnGoHome(){
  closeSideMenu(); closeAll();
  window.scrollTo({top:0, behavior:'smooth'});
}
function bnGoOffers(){
  closeSideMenu(); closeAll();
  document.getElementById('products').scrollIntoView({behavior:'smooth'});
}
function bnGoTrack(){
  closeSideMenu();
  alert(t('trackSoon'));
}
function toggleSearch(){ alert('🔍 البحث قريباً!'); }
function closeAll(){
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
}
function closeModal(id){ document.getElementById(id).classList.remove('show'); }

function openEdit(id){
  editingId = id;
  const p = products.find(x=>x.id===id);
  document.getElementById('edName').value = p.name;
  document.getElementById('edPrice').value = p.price;
  document.getElementById('edQty').value = p.qty;
  document.getElementById('editModal').classList.add('show');
}
function saveEdit(){
  const p = products.find(x=>x.id===editingId);
  p.name = document.getElementById('edName').value || p.name;
  p.price = Number(document.getElementById('edPrice').value) || p.price;
  p.qty = Number(document.getElementById('edQty').value) || p.qty;
  closeModal('editModal');
  renderGrid();
  updateCartUI();
}

function orderWhatsapp(id){
  const p = products.find(x=>x.id===id);
  const msg = encodeURIComponent(t('waMsg')(p.name, p.price));
  window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${msg}`,'_blank');
}

function openCheckout(){
  if(cart.length===0){ alert(t('emptyCartAlert')); return; }
  const sel = document.getElementById('ckWilaya');
  sel.innerHTML = wilayas.map(w=>`<option>${w}</option>`).join('');
  const subtotal = cart.reduce((s,c)=>{const p=products.find(x=>x.id===c.id); return s + p.price*c.qty;},0);
  const delivery = 500;
  const T = I18N[lang];
  document.getElementById('ckSummary').innerHTML = `
    <div class="summary-row"><span>${T.sumQty}</span><span>${cart.reduce((s,c)=>s+c.qty,0)}</span></div>
    <div class="summary-row"><span>${T.sumSub}</span><span>${subtotal.toLocaleString()} د.ج</span></div>
    <div class="summary-row"><span>${T.sumDelivery}</span><span>${delivery} د.ج</span></div>
    <div class="summary-row" style="font-weight:700;border-top:1px solid #ddd;padding-top:6px;"><span>${T.sumTotal}</span><span>${(subtotal+delivery).toLocaleString()} د.ج</span></div>`;
  closeAll();
  document.getElementById('checkoutModal').classList.add('show');
}
function confirmOrder(){
  const name=document.getElementById('ckName').value;
  const phone=document.getElementById('ckPhone').value;
  if(!name||!phone){ alert(t('needNamePhone')); return; }
  alert(t('orderOk'));
  cart = [];
  updateCartUI();
  closeModal('checkoutModal');
}

applyI18n();
</script>
</body>
</html>
